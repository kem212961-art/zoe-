<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin · Fiesta Zoe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap');
:root{--ink:#78248d;--candy:#ef258c;--candy-dark:#b91970;--cream:#fff8fc;--gold:#ffda55;--surface:#ffffffee;--border:#eab6d8;--muted:#a07ab0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Quicksand,sans-serif;background:radial-gradient(ellipse at 50% 0%,#fff4fb,#f3e5ff 60%,#e8f0ff);min-height:100vh;color:var(--ink)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);border:2px solid #fff;border-radius:28px;box-shadow:0 0 0 1px var(--border),0 8px 32px #c46aaa22;padding:36px 32px 32px;width:100%;max-width:390px;text-align:center}
.login-card h1{font-family:'Baloo 2',cursive;font-size:26px;color:var(--ink);margin-bottom:4px}
.login-card .sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.field{text-align:left;margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.field input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:14px;font-size:15px;color:var(--ink);background:#fff9fc;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--candy)}
.btn-primary{width:100%;padding:14px;border:none;border-radius:16px;background:linear-gradient(135deg,#f55baa,#d1218a);color:#fff;font-weight:800;font-size:16px;letter-spacing:.5px;box-shadow:0 4px 0 #9e1868,0 6px 18px #d1218a33;transition:transform .15s}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:active{transform:translateY(2px)}
#login-error{color:#c0145e;font-size:13px;margin-top:10px;min-height:18px}
#dashboard{display:none;min-height:100vh}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:#fff9fc;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.top-bar h1{font-family:'Baloo 2',cursive;font-size:20px;color:var(--ink)}
.top-bar .logout{border:2px solid var(--border);background:transparent;color:var(--muted);border-radius:12px;padding:7px 16px;font-size:13px;font-weight:700;transition:background .2s}
.top-bar .logout:hover{background:#fce4f2}
.content{max-width:860px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:2px solid #fff;border-radius:22px;box-shadow:0 0 0 1px var(--border),0 4px 20px #c46aaa14;padding:26px 24px}
.card-title{display:flex;align-items:center;gap:10px;font-family:'Baloo 2',cursive;font-size:19px;color:var(--ink);margin-bottom:20px}
.card-title .icon{font-size:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.form-group input,.form-group textarea{padding:11px 15px;border:2px solid var(--border);border-radius:13px;font-size:15px;color:var(--ink);background:#fff9fc;outline:none;resize:vertical;transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--candy)}
.form-group.full{grid-column:1/-1}
.save-btn{margin-top:18px;padding:12px 28px;border:none;border-radius:14px;background:linear-gradient(135deg,#f55baa,#d1218a);color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 0 #9e1868;transition:transform .15s}
.save-btn:hover{transform:translateY(-1px)}
.save-btn:active{transform:translateY(2px)}
.save-feedback{font-size:13px;color:#2ba05a;font-weight:700;margin-top:10px;min-height:18px}
.counter{font-size:28px;font-family:'Baloo 2',cursive;color:var(--candy);font-weight:800;margin-bottom:4px}
.counter-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.rsvp-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
.rsvp-list::-webkit-scrollbar{width:5px}
.rsvp-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.rsvp-item{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;background:#fff4fa;border:1px solid var(--border);border-radius:13px;font-size:14px;font-weight:700;color:var(--ink)}
.rsvp-item .time{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;margin-left:10px}
.empty-state{text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
.del-btn{border:none;background:transparent;color:#d1218a;font-size:16px;cursor:pointer;padding:2px 6px;border-radius:8px;transition:background .15s}
.del-btn:hover{background:#fce4f2}
.export-btn{margin-top:16px;padding:10px 20px;border:2px solid var(--border);background:#fff;color:var(--ink);border-radius:12px;font-weight:700;font-size:13px;transition:background .2s}
.export-btn:hover{background:#fce4f2}
.sb-status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
</style>
</head>
<body>

<section id="login-screen">
  <div class="login-card">
    <div style="font-size:36px;margin-bottom:8px">🎀</div>
    <h1>Panel de Zoe</h1>
    <p class="sub">Ingresa para administrar la fiesta</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Entrar ✦</button>
      <p id="login-error" aria-live="polite"></p>
    </form>
  </div>
</section>

<div id="dashboard">
  <div class="top-bar">
    <h1>🎀 Panel de Zoe</h1>
    <button class="logout" id="logout-btn">Salir</button>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-title"><span class="icon">🗓️</span> Datos del evento</div>
      <form id="event-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="ev-date">Fecha</label>
            <input type="text" id="ev-date" placeholder="ej: 12 de diciembre">
          </div>
          <div class="form-group">
            <label for="ev-time">Hora</label>
            <input type="text" id="ev-time" placeholder="ej: 4:00 PM">
          </div>
          <div class="form-group full">
            <label for="ev-place">Lugar</label>
            <input type="text" id="ev-place" placeholder="ej: Mz I Lt 3, Nuevo Amanecer">
          </div>
          <div class="form-group full">
            <label for="ev-extra">Mensaje extra (opcional)</label>
            <textarea id="ev-extra" rows="2" placeholder="ej: Usar ropa de colores ✦"></textarea>
          </div>
        </div>
        <button type="submit" class="save-btn">Guardar cambios ✦</button>
        <p class="save-feedback" id="event-feedback" aria-live="polite"></p>
        <p class="sb-status" id="sb-status"></p>
      </form>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">🌈</span> Confirmaciones de asistencia</div>
      <p class="counter" id="rsvp-count">0</p>
      <p class="counter-sub">invitados confirmados</p>
      <div class="rsvp-list" id="rsvp-list">
        <div class="empty-state">Cargando... ✦</div>
      </div>
      <button class="export-btn" id="export-btn">📋 Exportar lista como texto</button>
    </div>
  </div>
</div>

<script>
// ── Supabase config ──
const SB_URL  = 'https://nrlraihrsqfkrvoqbkqoa.supabase.co';
const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ybHJhaWhyc2dma3J2b2JrcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTM1NDQsImV4cCI6MjExMDE2OTU0NH0.SjUvcg3U3eLyG5jSiD9BJTHGCv1TPWppsdFv92hkCWE';

async function sbFetch(path, opts={}){
  const res = await fetch(SB_URL+'/rest/v1/'+path, {
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json', 'Prefer':'return=representation', ...opts.headers },
    ...opts
  });
  if(!res.ok){ const t=await res.text(); throw new Error(t); }
  return res.json();
}

// ── credenciales ──
const CRED = { email: 'zoemariana05', password: 'zoemariana' };

const loginForm   = document.getElementById('login-form');
const loginError  = document.getElementById('login-error');
const dashboard   = document.getElementById('dashboard');
const loginScreen = document.getElementById('login-screen');

function checkSession(){
  if(sessionStorage.getItem('zoe_admin')==='1') showDashboard();
}

loginForm.addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  if(email===CRED.email && pass===CRED.password){
    sessionStorage.setItem('zoe_admin','1');
    loginError.textContent='';
    showDashboard();
  } else {
    loginError.textContent='✦ Correo o contraseña incorrectos';
  }
});

document.getElementById('logout-btn').addEventListener('click',()=>{
  sessionStorage.removeItem('zoe_admin');
  dashboard.style.display='none';
  loginScreen.style.display='flex';
});

function showDashboard(){
  loginScreen.style.display='none';
  dashboard.style.display='block';
  loadEventForm();
  loadRsvpList();
}

// ── evento ──
async function loadEventForm(){
  try{
    const rows = await sbFetch('event_data?id=eq.1&select=*');
    if(rows && rows[0]){
      const d = rows[0];
      document.getElementById('ev-date').value  = d.date  || '';
      document.getElementById('ev-time').value  = d.time  || '';
      document.getElementById('ev-place').value = d.place || '';
      document.getElementById('ev-extra').value = d.extra || '';
    }
  }catch(err){ document.getElementById('sb-status').textContent='Error cargando datos: '+err.message; }
}

document.getElementById('event-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fb  = document.getElementById('event-feedback');
  const st  = document.getElementById('sb-status');
  const data = {
    date:  document.getElementById('ev-date').value.trim(),
    time:  document.getElementById('ev-time').value.trim(),
    place: document.getElementById('ev-place').value.trim(),
    extra: document.getElementById('ev-extra').value.trim(),
  };
  fb.textContent='Guardando...';
  try{
    await sbFetch('event_data?id=eq.1', { method:'PATCH', body:JSON.stringify(data) });
    fb.textContent='✦ ¡Cambios guardados en Supabase!';
    st.textContent='';
    setTimeout(()=>fb.textContent='',3000);
  }catch(err){
    fb.textContent='';
    st.textContent='Error: '+err.message;
  }
});

// ── confirmados ──
let rsvpData = [];

async function loadRsvpList(){
  const container = document.getElementById('rsvp-list');
  try{
    rsvpData = await sbFetch('rsvp?select=*&order=created_at.desc');
    document.getElementById('rsvp-count').textContent = rsvpData.length;
    if(!rsvpData.length){
      container.innerHTML='<div class="empty-state">Aún no hay confirmaciones ✦</div>';
      return;
    }
    container.innerHTML = rsvpData.map((item,i)=>`
      <div class="rsvp-item">
        <span>♡ ${escHtml(item.name)}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="time">${new Date(item.created_at).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})}</span>
          <button class="del-btn" onclick="deleteRsvp('${item.id}')" aria-label="Eliminar">✕</button>
        </span>
      </div>`).join('');
  }catch(err){
    container.innerHTML=`<div class="empty-state">Error cargando: ${err.message}</div>`;
  }
}

async function deleteRsvp(id){
  try{
    await sbFetch('rsvp?id=eq.'+id, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
    loadRsvpList();
  }catch(err){ alert('Error al eliminar: '+err.message); }
}

document.getElementById('export-btn').addEventListener('click',()=>{
  if(!rsvpData.length){ alert('No hay confirmaciones aún.'); return; }
  const text = rsvpData.map((r,i)=>`${i+1}. ${r.name} — ${new Date(r.created_at).toLocaleString('es-PE')}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('✦ Lista copiada al portapapeles')).catch(()=>alert(text));
});

function escHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

checkSession();
</script>
</body>
</html>
