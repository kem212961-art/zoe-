<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fce5f1">
<title>Confirmar asistencia · Fiesta de Zoe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap');
:root{--ink:#78248d;--candy:#ef258c;--border:#eab6d8;--muted:#a07ab0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Quicksand,sans-serif;background:radial-gradient(ellipse at 50% 0%,#fff4fb,#f3e5ff 55%,#eaf0ff 100%);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:var(--ink)}
.card{background:#ffffffee;border:2px solid #fff;border-radius:28px;box-shadow:0 0 0 1px var(--border),0 8px 32px #c46aaa1a;padding:36px 28px 32px;width:100%;max-width:420px;text-align:center}
.emoji{font-size:48px;margin-bottom:8px;display:block}
.card h1{font-family:'Baloo 2',cursive;font-size:24px;color:var(--ink);margin-bottom:6px}
.card .sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.event-info{background:linear-gradient(135deg,#fff4fc,#f4eaff);border:2px solid #fff;border-radius:18px;box-shadow:0 0 0 1px var(--border);padding:16px 18px;margin-bottom:24px;text-align:left;display:flex;flex-direction:column;gap:9px}
.ev-row{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:700;color:var(--ink)}
.ev-row .ev-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.form-group{text-align:left;margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.form-group input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:14px;font-size:16px;color:var(--ink);background:#fff9fc;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--candy)}
.confirm-btn{width:100%;padding:14px;border:none;border-radius:16px;background:linear-gradient(135deg,#f55baa,#d1218a);color:#fff;font-weight:800;font-size:16px;letter-spacing:.4px;box-shadow:0 4px 0 #9e1868,0 6px 18px #d1218a33;transition:transform .15s;margin-top:4px}
.confirm-btn:hover{transform:translateY(-1px)}
.confirm-btn:active{transform:translateY(2px)}
.confirm-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
#form-section{display:block}
#success-section{display:none;text-align:center}
.success-emoji{font-size:64px;margin-bottom:12px;display:block;animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#success-section h2{font-family:'Baloo 2',cursive;font-size:22px;margin-bottom:8px;color:var(--ink)}
#success-section p{color:var(--muted);font-size:14px;line-height:1.7}
#error-msg{color:#c0145e;font-size:13px;margin-top:8px;min-height:18px}
.confetti{position:fixed;top:-20px;pointer-events:none;z-index:10;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(620deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <span class="emoji">🎀</span>
  <h1>¡Estás invitado a la fiesta de Zoe!</h1>
  <p class="sub">Confirma tu asistencia para que te esperemos ✦</p>
  <div class="event-info" id="event-info">
    <div class="ev-row"><span class="ev-icon">🗓️</span><span id="ev-date">Cargando...</span></div>
    <div class="ev-row"><span class="ev-icon">🕓</span><span id="ev-time">Cargando...</span></div>
    <div class="ev-row"><span class="ev-icon">📍</span><span id="ev-place">Cargando...</span></div>
    <div class="ev-row" id="ev-extra-row" style="display:none"><span class="ev-icon">✦</span><span id="ev-extra"></span></div>
  </div>
  <div id="form-section">
    <form id="rsvp-form" novalidate>
      <div class="form-group">
        <label for="guest-name">Tu nombre completo</label>
        <input type="text" id="guest-name" placeholder="Escribe tu nombre aquí" autocomplete="name" required maxlength="60">
      </div>
      <button type="submit" class="confirm-btn" id="confirm-btn">♡ Confirmar mi asistencia</button>
      <p id="error-msg" aria-live="polite"></p>
    </form>
  </div>
  <div id="success-section" aria-live="polite">
    <span class="success-emoji">🎉</span>
    <h2>¡Confirmado!</h2>
    <p id="success-msg">¡Gracias! Te esperamos con mucha ilusión en la fiesta de Zoe ♡</p>
  </div>
</div>

<script>
const SB_URL = 'https://nrlraihrsgfkrvobkqoa.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ybHJhaWhyc2dma3J2b2JrcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTM1NDQsImV4cCI6MjExMDE2OTU0NH0.SjUvcg3U3eLyG5jSiD9BJTHGCv1TPWppsdFv92hkCWE';

async function sbFetch(path, opts={}){
  const res = await fetch(SB_URL+'/rest/v1/'+path,{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation',...opts.headers},
    ...opts
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  const ct=res.headers.get('content-type')||'';
  return ct.includes('json')?res.json():null;
}

// cargar datos del evento
async function loadEvent(){
  try{
    const rows = await sbFetch('event_data?id=eq.1&select=*');
    if(rows&&rows[0]){
      const d=rows[0];
      document.getElementById('ev-date').textContent  = d.date  || '12 de diciembre';
      document.getElementById('ev-time').textContent  = d.time  || '4:00 PM';
      document.getElementById('ev-place').textContent = d.place || 'Mz I Lt 3, Nuevo Amanecer';
      if(d.extra){
        document.getElementById('ev-extra').textContent=d.extra;
        document.getElementById('ev-extra-row').style.display='flex';
      }
    }
  }catch{ /* usar defaults */ }
}
loadEvent();

// confirmar asistencia
document.getElementById('rsvp-form').addEventListener('submit', async e => {
  e.preventDefault();
  const nameInput = document.getElementById('guest-name');
  const name = nameInput.value.trim();
  const errEl = document.getElementById('error-msg');
  if(!name){ errEl.textContent='✦ Por favor escribe tu nombre'; nameInput.focus(); return; }
  errEl.textContent='';
  const btn = document.getElementById('confirm-btn');
  btn.disabled=true;
  btn.textContent='Guardando...';
  try{
    // verificar duplicado
    const existing = await sbFetch('rsvp?name=ilike.'+encodeURIComponent(name)+'&select=id');
    if(existing&&existing.length){ errEl.textContent='✦ Ya confirmaste con ese nombre ♡'; btn.disabled=false; btn.textContent='♡ Confirmar mi asistencia'; return; }
    await sbFetch('rsvp',{method:'POST',body:JSON.stringify({name})});
    // confeti
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
      for(let i=0;i<70;i++){const p=document.createElement('span');p.className='confetti';p.textContent=['✦','♥','●','★'][i%4];p.style.cssText=`left:${Math.random()*100}%;color:${['#d6a1e7','#ec87b8','#9cd6ec','#e7c56f'][i%4]};font-size:${12+Math.random()*18}px;animation-delay:${Math.random()*.5}s`;document.body.append(p);setTimeout(()=>p.remove(),4000);}
    }
    document.getElementById('form-section').style.display='none';
    document.getElementById('success-section').style.display='block';
    document.getElementById('success-msg').textContent=`¡Gracias, ${name}! Te esperamos con mucha ilusión en la fiesta de Zoe ♡`;
  }catch(err){
    errEl.textContent='Error al guardar: '+err.message;
    btn.disabled=false;
    btn.textContent='♡ Confirmar mi asistencia';
  }
});
</script>
</body>
</html>
